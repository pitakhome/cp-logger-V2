<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Field Logger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .history-box { background: #e8f4fd; border-left: 4px solid #0d6efd; padding: 12px; margin-bottom: 20px; display: none; font-size: 0.85rem; }
    .section-title { font-weight: bold; color: #333; margin-top: 15px; margin-bottom: 5px; }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width: 500px;">
    <div id="historyContainer" class="history-box">
      <div class="d-flex justify-content-between mb-2">
        <button class="btn btn-sm btn-outline-primary" onclick="navigateHistory(1)">« ก่อนหน้า</button>
        <span id="his-index" class="fw-bold">1 / 1</span>
        <button class="btn btn-sm btn-outline-primary" onclick="navigateHistory(-1)">ถัดไป »</button>
      </div>
      <div>วันที่: <span id="his-time" class="fw-bold"></span></div>
      <div class="row g-1">
        <div class="col-6">Von PTT: <span id="his-von_ptt" class="fw-bold"></span></div>
        <div class="col-6">Voff PTT: <span id="his-voff_ptt" class="fw-bold"></span></div>
        <div class="col-12">Foreign: <span id="his-foreign" class="fw-bold"></span></div>
        <div class="col-6">Von F: <span id="his-von_foreign" class="fw-bold"></span></div>
        <div class="col-6">Voff F: <span id="his-voff_foreign" class="fw-bold"></span></div>
        <div class="col-12">Resistor: <span id="his-resistor" class="fw-bold"></span></div>
      </div>
    </div>

    <form id="cpForm">
      <div class="section-title">ข้อมูลจุดวัด</div>
      <input type="text" class="form-control mb-2" id="nick_name" placeholder="Nick Name" onblur="fetchPreviousDataJSONP(this.value)">
      
      <div class="section-title">บันทึกค่าการวัด</div>
      <select class="form-select mb-2" id="type"><option value="Direct">Direct</option><option value="No Bond">No Bond</option></select>
      <input type="number" class="form-control mb-2" id="von_ptt" placeholder="Von PTT" step="any">
      <input type="number" class="form-control mb-2" id="voff_ptt" placeholder="Voff PTT" step="any">
      <input type="text" class="form-control mb-2" id="foreign_pipe" placeholder="Foreign Pipe">
      <input type="number" class="form-control mb-2" id="von_foreign" placeholder="Von Foreign" step="any">
      <input type="number" class="form-control mb-2" id="voff_foreign" placeholder="Voff Foreign" step="any">
      <input type="number" class="form-control mb-2" id="current_adc" placeholder="Current ADC" step="any">
      <input type="number" class="form-control mb-2" id="current_aac" placeholder="Current AAC" step="any">
      <input type="text" class="form-control mb-2" id="resistor" placeholder="Resistor">
      <textarea class="form-control mb-2" id="remark" placeholder="หมายเหตุ"></textarea>
      
      <button type="button" class="btn btn-success w-100" onclick="submitData()">บันทึกข้อมูล</button>
    </form>
  </div>

  <script>
    // --- เปลี่ยน URL ตรงนี้เป็น URL ที่ได้จากการ Deploy ---
    const WEB_APP_URL = "ใส่ URL ของคุณที่นี่"; 
    // ---------------------------------------------------

    let historyData = [];
    let currentIndex = 0;

    function fetchPreviousDataJSONP(nickName) {
      if(!nickName) return;
      let script = document.createElement('script');
      script.src = `${WEB_APP_URL}?nick_name=${encodeURIComponent(nickName)}&callback=showHistoryData`;
      document.body.appendChild(script);
    }

    function showHistoryData(data) {
      historyData = data;
      currentIndex = 0;
      if(historyData.length > 0) {
        document.getElementById('historyContainer').style.display = 'block';
        updateDisplay();
      }
    }

    function updateDisplay() {
      let d = historyData[currentIndex];
      document.getElementById('his-time').innerText = d.timestamp;
      document.getElementById('his-von_ptt').innerText = d.von_ptt;
      document.getElementById('his-voff_ptt').innerText = d.voff_ptt;
      document.getElementById('his-foreign').innerText = d.foreign_pipe;
      document.getElementById('his-von_foreign').innerText = d.von_foreign;
      document.getElementById('his-voff_foreign').innerText = d.voff_foreign;
      document.getElementById('his-resistor').innerText = d.resistor;
      document.getElementById('his-index').innerText = (currentIndex + 1) + " / " + historyData.length;
    }

    function navigateHistory(step) {
      currentIndex = Math.max(0, Math.min(historyData.length - 1, currentIndex + step));
      updateDisplay();
    }

    function submitData() {
      let payload = {
        nick_name: document.getElementById('nick_name').value,
        type: document.getElementById('type').value,
        von_ptt: document.getElementById('von_ptt').value,
        voff_ptt: document.getElementById('voff_ptt').value,
        foreign_pipe: document.getElementById('foreign_pipe').value,
        von_foreign: document.getElementById('von_foreign').value,
        voff_foreign: document.getElementById('voff_foreign').value,
        current_adc: document.getElementById('current_adc').value,
        current_aac: document.getElementById('current_aac').value,
        resistor: document.getElementById('resistor').value,
        remark: document.getElementById('remark').value
      };
      
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(() => alert("บันทึกข้อมูลเรียบร้อย!"));
    }
  </script>
</body>
</html>
