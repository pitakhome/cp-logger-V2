<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Field Logger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .section-title { font-size: 0.95rem; font-weight: 700; color: #495057; border-bottom: 2px solid #e9ecef; padding-bottom: 6px; margin: 15px 0; }
    .history-box { background: #e8f4fd; border-left: 4px solid #0d6efd; border-radius: 6px; padding: 12px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 650px;">
    <div class="card p-4">
      <h4 class="text-center mb-4"><i class="fa-solid fa-bolt-lightning me-2"></i>CP Field Logger</h4>
      
      <!-- สแกน QR -->
      <div id="reader" style="width: 100%;"></div>
      <button class="btn btn-outline-dark btn-sm mt-2 w-100" id="btn-rescan" style="display:none;" onclick="startScanner()">สแกนใหม่อีกครั้ง</button>

      <!-- กล่องแสดงข้อมูลย้อนหลังภายในเดือน -->
      <div id="historyContainer" class="mt-4 history-box">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="fw-bold text-primary">
            <button class="btn btn-sm btn-outline-primary" onclick="navigateHistory(1)">« ก่อนหน้า</button>
            <span id="his-index" class="mx-2">1 / 1</span>
            <button class="btn btn-sm btn-outline-primary" onclick="navigateHistory(-1)">ถัดไป »</button>
          </div>
        </div>
        <div class="row g-1 text-secondary">
          <div class="col-12 text-dark fw-bold mb-1">บันทึกเมื่อ: <span id="his-time">-</span></div>
          <div class="col-4">Type: <span id="his-type" class="text-dark fw-bold">-</span></div>
          <div class="col-4">Von PTT: <span id="his-von_ptt" class="text-dark fw-bold">-</span></div>
          <div class="col-4">Voff PTT: <span id="his-voff_ptt" class="text-dark fw-bold">-</span></div>
          <div class="col-6">Foreign: <span id="his-foreign" class="text-dark fw-bold">-</span></div>
          <div class="col-3">Von F: <span id="his-von_f" class="text-dark fw-bold">-</span></div>
          <div class="col-3">Voff F: <span id="his-voff_f" class="text-dark fw-bold">-</span></div>
        </div>
      </div>

      <!-- ฟอร์มบันทึก -->
      <form id="cpForm" onsubmit="submitForm(event)">
        <div class="section-title">ข้อมูลจุดวัด</div>
        <div class="row g-2">
          <input type="text" class="form-control" id="nick_name" readonly placeholder="Nick Name">
          <!-- (ใส่ช่องอื่นๆ ของคุณต่อได้เลย) -->
        </div>

        <div class="section-title">บันทึกค่าการวัด</div>
        <select class="form-select mb-2" id="type" required>
            <option value="">-- เลือกประเภท --</option>
            <option value="Direct">Direct</option>
            <option value="No Bond">No Bond</option>
        </select>
        <button type="submit" class="btn btn-success w-100 mt-3" id="submitBtn">บันทึกข้อมูล</button>
      </form>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwzJbO8nLsdHqSYv3a1c4X7071zKqVLLOolFNM0xtMpajh8CaidrYJOSgwcc8UISDoN/exec";
    let historyData = [];
    let currentIndex = 0;

    // ส่วนการทำงาน JSONP
    function fetchPreviousDataJSONP(nickName) {
      let old = document.getElementById('jsonpScript');
      if (old) old.remove();
      let script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `${WEB_APP_URL}?nick_name=${encodeURIComponent(nickName)}&callback=showHistoryData`;
      document.body.appendChild(script);
    }

    function showHistoryData(data) {
      historyData = data;
      currentIndex = 0;
      if(historyData.length > 0) {
        updateDisplay();
        document.getElementById('historyContainer').style.display = 'block';
      }
    }

    function updateDisplay() {
      let d = historyData[currentIndex];
      document.getElementById('his-time').innerText = d.timestamp;
      document.getElementById('his-type').innerText = d.type;
      document.getElementById('his-von_ptt').innerText = d.von_ptt;
      document.getElementById('his-voff_ptt').innerText = d.voff_ptt;
      document.getElementById('his-foreign').innerText = d.foreign_pipe;
      document.getElementById('his-von_f').innerText = d.von_foreign;
      document.getElementById('his-voff_f').innerText = d.voff_foreign;
      document.getElementById('his-index').innerText = (currentIndex + 1) + " / " + historyData.length;
    }

    function navigateHistory(step) {
      currentIndex += step;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= historyData.length) currentIndex = historyData.length - 1;
      updateDisplay();
    }

    // ฟังก์ชันอื่นๆ เช่น onScanSuccess และ submitForm (ใช้เหมือนเดิมได้เลย)
    // ...
  </script>
</body>
</html>
